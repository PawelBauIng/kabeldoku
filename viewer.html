<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabel-Fotodoku · /*__TITEL__*/</title>
<style>
:root{--bg:#ECEDEA;--panel:#FAFAF8;--ink:#1E2328;--muted:#5D656D;--line:#CDD1D3;--accent:#D9531A;--table:#D5D8D5;
  --f-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#15181B;--panel:#1E2226;--ink:#E7EAEC;--muted:#9AA3AB;--line:#30363C;--accent:#F06A2C;--table:#0E1113;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
h1{margin:0;font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}h1 span{color:var(--accent)}
header small{color:var(--muted);font-size:12.5px;display:block}
header .grow{flex:1;min-width:0}
.wrap{flex:1;display:flex;min-height:0}
.stage{position:relative;flex:1;overflow:hidden;background:var(--table);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.plan{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;user-select:none;max-width:none;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);border:0;background:none;padding:0;width:40px;height:46px;cursor:pointer}
.pin .h{position:absolute;left:4px;top:0;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin .n{position:absolute;left:4px;top:0;width:32px;height:32px;display:grid;place-items:center;font:700 15px var(--f-display);color:#fff}
.pin.sel .h{background:var(--ink);border-color:var(--accent)}.pin.sel .n{color:var(--panel)}
.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 16px}
.tab{flex:none;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13.5px var(--f-body);cursor:pointer}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pt{font:600 11.5px var(--f-body);color:var(--accent);margin-left:6px}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer}
aside{width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .detail{padding:16px;border-bottom:1px solid var(--line);overflow:auto;max-height:65%}
aside .detail:empty{display:none}
aside ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
aside li button{display:grid;grid-template-columns:52px 1fr;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;padding:10px 16px;cursor:pointer;align-items:center}
aside li button:hover,aside li button.sel{background:var(--bg)}
.th{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--bg);display:block}
.t1{font:700 17px var(--f-display)}.t2{color:var(--muted);font-size:13px}.t3{font:11.5px var(--f-mono);color:var(--muted)}
.detail h2{margin:0 0 8px;font:700 26px var(--f-display);color:var(--accent)}
.detail img{width:100%;border-radius:8px;display:block;margin-bottom:10px;cursor:zoom-in}
.detail p{margin:0 0 8px;white-space:pre-wrap}
.detail .meta{font:12.5px var(--f-mono);color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(10,12,14,.94);display:grid;place-items:center;padding:16px;z-index:9}
.lb img{max-width:100%;max-height:100%}
.lb button{position:absolute;top:12px;right:12px;background:#fff;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
[hidden]{display:none!important}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:100%;border-left:0;border-top:1px solid var(--line);height:45%}}
</style>
</head>
<body>
<header><div class="grow"><h1>Kabel<span>·</span>Fotodoku</h1><small id="sub"></small></div><small id="hint">Mausrad oder zwei Finger zum Zoomen, ziehen zum Verschieben, Punkt anklicken für Foto.</small></header>
<nav class="tabs" id="tabs" hidden></nav>
<div class="wrap">
  <div class="stage" id="stage"><img class="plan" id="plan" alt="Kabelplan"><div class="pins" id="pins"></div>
    <div class="zoom"><button type="button" id="zi" aria-label="Hineinzoomen">+</button><button type="button" id="zo" aria-label="Herauszoomen">−</button><button type="button" id="zf" aria-label="Ganzer Plan">⤢</button></div></div>
  <aside><div class="detail" id="detail"></div><ul id="list"></ul></aside>
</div>
<div class="lb" id="lb" hidden><img id="lbi" alt=""><button type="button" id="lbc">Schließen</button></div>
<script>
(function(){
const D=/*__DATA__*/null;
const $=i=>document.getElementById(i);const st=$("stage"),pl=$("plan"),pins=$("pins");
const pad=n=>String(n).padStart(2,"0");const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fz=i=>{try{return new Date(i).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
if(!D){document.body.innerHTML="<p style='padding:20px'>Keine Daten enthalten.</p>";return}
if(!D.plaene&&D.plan){D.plaene=[{name:D.planName||"Plan",src:D.plan.src,w:D.plan.w,h:D.plan.h}];D.punkte.forEach(p=>p.p=0)}
const PL=D.plaene;D.punkte.forEach(p=>{if(!p.fotos)p.fotos=p.foto?[p.foto]:[]});
$("sub").textContent=D.projekt+" · "+(PL.length>1?PL.length+" Pläne · ":"")+D.punkte.length+" Fotopunkte · Stand "+fz(D.exportiert);
let v={s:1,tx:0,ty:0},sel=null,cur=-1,W=1,H=1;
function setPlan(k,keep){if(k===cur)return;cur=k;W=PL[k].w;H=PL[k].h;pl.style.width=W+"px";pl.style.height=H+"px";pl.onload=()=>{if(!keep)fit()};pl.src=PL[k].src;tabs();if(!keep)fit();else ap()}
function tabs(){const t=$("tabs");if(PL.length<2){t.hidden=true;return}t.hidden=false;t.innerHTML=PL.map((q,i)=>"<button class='tab"+(i===cur?" on":"")+"' data-k='"+i+"'>"+esc(q.name)+" ("+D.punkte.filter(p=>p.p===i).length+")</button>").join("");t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setPlan(+b.dataset.k))}
function ap(){pl.style.transform="translate("+v.tx+"px,"+v.ty+"px) scale("+v.s+")";pins.innerHTML=D.punkte.map((p,i)=>p.p!==cur?"":"<button class='pin"+(sel===i?" sel":"")+"' data-i='"+i+"' style='left:"+(v.tx+p.x*W*v.s)+"px;top:"+(v.ty+p.y*H*v.s)+"px' aria-label='FP "+pad(p.nr)+"'><span class='h'></span><span class='n'>"+pad(p.nr)+"</span></button>").join("");
  pins.querySelectorAll(".pin").forEach(b=>b.onclick=e=>{e.stopPropagation();show(+b.dataset.i)})}
function fit(){const r=st.getBoundingClientRect();v.s=Math.min((r.width-40)/W,(r.height-40)/H);v.tx=(r.width-W*v.s)/2;v.ty=(r.height-H*v.s)/2;ap()}
const mn=()=>{const r=st.getBoundingClientRect();return Math.min(r.width/W,r.height/H)*.5};
function za(f,cx,cy){const ns=Math.max(mn(),Math.min(8,v.s*f)),k=ns/v.s;v.tx=cx-(cx-v.tx)*k;v.ty=cy-(cy-v.ty)*k;v.s=ns;ap()}
const P=new Map();let g=null;
st.addEventListener("pointerdown",e=>{if(e.target.closest(".pin,.zoom"))return;st.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=st.getBoundingClientRect();
  if(P.size===1)g={m:"p",sx:e.clientX,sy:e.clientY,tx:v.tx,ty:v.ty};else if(P.size===2){const[a,b]=[...P.values()];g={m:"z",d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,s:v.s,tx:v.tx,ty:v.ty}}});
st.addEventListener("pointermove",e=>{if(!P.has(e.pointerId)||!g)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=st.getBoundingClientRect();
  if(g.m==="z"&&P.size>1){const[a,b]=[...P.values()];const ns=Math.max(mn(),Math.min(8,g.s*Math.hypot(a.x-b.x,a.y-b.y)/g.d));const wx=(g.mx-g.tx)/g.s,wy=(g.my-g.ty)/g.s;v.s=ns;v.tx=(a.x+b.x)/2-r.left-wx*ns;v.ty=(a.y+b.y)/2-r.top-wy*ns;ap()}
  else if(g.m==="p"){v.tx=g.tx+e.clientX-g.sx;v.ty=g.ty+e.clientY-g.sy;ap()}});
const up=e=>{P.delete(e.pointerId);if(!P.size)g=null;else if(P.size===1){const p=[...P.values()][0];g={m:"p",sx:p.x,sy:p.y,tx:v.tx,ty:v.ty}}};
st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
st.addEventListener("wheel",e=>{e.preventDefault();const r=st.getBoundingClientRect();za(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$("zi").onclick=()=>{const r=st.getBoundingClientRect();za(1.5,r.width/2,r.height/2)};$("zo").onclick=()=>{const r=st.getBoundingClientRect();za(1/1.5,r.width/2,r.height/2)};$("zf").onclick=fit;
addEventListener("resize",ap);
function show(i){sel=i;const p=D.punkte[i];if(p.p!==cur)setPlan(p.p,true);
  $("detail").innerHTML="<h2>FP "+pad(p.nr)+"</h2>"+(p.fotos.length?p.fotos.map((f,k)=>"<img class='dimg' data-k='"+k+"' src='"+f+"' alt='Foto "+(k+1)+" FP "+pad(p.nr)+"'>").join("")+(p.fotos.length>1?"<div class='meta' style='margin-bottom:8px'>"+p.fotos.length+" Fotos</div>":""):"<p class='meta'>Kein Foto</p>")+"<p>"+esc(p.notiz||"Keine Notiz")+"</p><div class='meta'>"+(PL.length>1?esc(PL[p.p].name)+" · ":"")+esc(fz(p.zeit))+" · x "+p.x.toFixed(3)+" · y "+p.y.toFixed(3)+"</div>";
  $("detail").querySelectorAll(".dimg").forEach(im=>im.onclick=()=>{$("lbi").src=im.src;$("lb").hidden=false});
  const r=st.getBoundingClientRect();const fs=Math.min((r.width-40)/W,(r.height-40)/H);if(v.s<fs*2.5)v.s=Math.min(fs*3,8);v.tx=r.width/2-p.x*W*v.s;v.ty=r.height/2-p.y*H*v.s;ap();list()}
function list(){$("list").innerHTML=D.punkte.map((p,i)=>"<li><button class='"+(sel===i?"sel":"")+"' data-i='"+i+"'>"+(p.fotos.length?"<img class='th' src='"+p.fotos[0]+"' alt=''>":"<span class='th'></span>")+"<span><span class='t1'>FP "+pad(p.nr)+"</span>"+(PL.length>1?"<span class='pt'>"+esc(PL[p.p].name)+"</span>":"")+"<br><span class='t2'>"+esc(p.notiz||"Keine Notiz")+"</span><br><span class='t3'>"+esc(fz(p.zeit))+"</span></span></button></li>").join("");
  $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>show(+b.dataset.i))}
$("lbc").onclick=()=>$("lb").hidden=true;$("lb").onclick=e=>{if(e.target.id==="lb")$("lb").hidden=true};
addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").hidden=true});
setPlan(0);list();
})();
</script>
</body>
</html>
